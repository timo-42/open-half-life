name: Rust fuzz smoke

on:
  push:
    paths:
      - .github/workflows/fuzz.yml
      - crates/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - crates/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-fuzz-smoke:
    name: Linux x64 cargo-fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked-file policy
        run: cargo xtask policy

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz ohl-parser-protocol (protocol, 60s)
        working-directory: crates/ohl-parser-protocol
        run: |
          mkdir -p fuzz/corpus/protocol
          cargo +nightly fuzz run protocol \
            --target x86_64-unknown-linux-gnu --sanitizer none \
            -- -max_total_time=60

      - name: Fuzz ohl-formats (bsp30_fuzz, 60s)
        working-directory: crates/ohl-formats
        run: |
          mkdir -p fuzz/corpus/bsp30_fuzz
          cargo +nightly fuzz run bsp30_fuzz \
            --target x86_64-unknown-linux-gnu --sanitizer none \
            -- -max_total_time=60

      - name: Fuzz ohl-formats (wad3_fuzz, 60s)
        working-directory: crates/ohl-formats
        run: |
          mkdir -p fuzz/corpus/wad3_fuzz
          cargo +nightly fuzz run wad3_fuzz \
            --target x86_64-unknown-linux-gnu --sanitizer none \
            -- -max_total_time=60
