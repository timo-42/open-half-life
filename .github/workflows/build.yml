name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: timo-42/vergit-action@v0.1.1

  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all --check

  rust-policy:
    name: Rust policy and crate graph
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked-file policy
        run: cargo xtask policy

      - name: Check crate dependency graph
        run: cargo xtask graph

  rust-clippy:
    name: Rust clippy (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Linux-only companion to `rust-clippy`: checks every crate that declares a
  # `std` feature (the no_std-capable ones) with that feature off, so a `std`
  # item that leaked out from behind its cfg gate is caught here instead of
  # only ever being built with `std` enabled. Deliberately scoped with `-p` to
  # just those crates rather than `--workspace`, so a crate with no
  # `[features]` table at all (for which `--no-default-features` is a no-op
  # anyway) can never turn this job red for an unrelated reason.
  rust-clippy-no-default:
    name: Rust clippy (no default features)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
      NO_STD_CRATES: >-
        -p ohl-audio -p ohl-cabinet -p ohl-cabinet-format -p ohl-core
        -p ohl-formats -p ohl-iso9660 -p ohl-isz -p ohl-media-archive
        -p ohl-mscab -p ohl-payload -p ohl-udf
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clippy
        run: cargo clippy $NO_STD_CRATES --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test $NO_STD_CRATES --no-default-features

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace

      - name: Doctest
        run: cargo test --workspace --doc

      # Linux only: exercises every feature combination together (`dev-tools`
      # included), on top of the default-features run above. GPU-touching
      # tests stay behind their existing `#[ignore]` gates either way, so
      # this only widens feature coverage, not the runner's capabilities.
      - name: Test (all features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --all-features

      # Linux only: the freestanding worker image is Linux x86-64-only (see
      # `ohl_parser_worker::BuildError::Unsupported`), so this cannot run on
      # the other two runners.
      - name: Worker image
        if: matrix.os == 'ubuntu-latest'
        run: cargo xtask worker-image

  rust-miri:
    name: Rust miri
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
      MIRIFLAGS: -Zmiri-disable-isolation
      PROPTEST_CASES: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri on the crates it can reach
        shell: bash
        run: |
          set -euo pipefail
          # Kept as a list rather than one `-p ... -p ...` workspace command
          # so a crate that has not been created yet (or has since been
          # removed) is simply skipped instead of failing the whole job.
          candidates=(ohl-parser-protocol ohl-formats)
          args=()
          for crate in "${candidates[@]}"; do
            if [ -d "crates/${crate}" ]; then
              args+=(-p "${crate}")
            else
              echo "skipping ${crate}: not present under crates/"
            fi
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no candidate crates present; nothing to do"
            exit 0
          fi
          cargo +nightly miri test "${args[@]}"

  rust-deny:
    name: Rust cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  # Packages a release with `cargo xtask dist` on each of the three
  # platforms and uploads the resulting archive as a workflow artifact.
  # Triggered by a `v*` tag push or a manual `workflow_dispatch`, not by
  # every ordinary push/PR; does not publish anything to GitHub Releases
  # yet (see `docs/MILESTONES.md`, M9 packaging).
  release:
    name: Release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package
        run: cargo xtask dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-half-life-${{ needs.version.outputs.version }}-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error
