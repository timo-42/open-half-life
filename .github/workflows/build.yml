name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: timo-42/vergit-action@v0.1.1

  build-and-test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            expected_os: Linux
            expected_arch: x86_64
            cmake_args: ""
          - os: windows-latest
            name: Windows x64
            expected_os: Windows
            expected_arch: x86_64
            cmake_args: ""
          - os: macos-15
            name: macOS Apple Silicon
            expected_os: macOS
            expected_arch: arm64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - os: ubuntu-latest
            name: Linux x64 experimental cabinet adapter
            expected_os: Linux
            expected_arch: x86_64
            cmake_args: -DOHL_ENABLE_EXPERIMENTAL_INSTALLSHIELD=ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Check repository policy
        run: cmake -P cmake/CheckRepository.cmake

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOHL_WARNINGS_AS_ERRORS=ON
          -DOHL_EXPECTED_OS=${{ matrix.expected_os }}
          -DOHL_EXPECTED_ARCH=${{ matrix.expected_arch }}
          -DOHL_VERSION_OVERRIDE=${{ needs.version.outputs.version }}
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux x64 sanitizers
    needs: version
    runs-on: ubuntu-latest
    env:
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DOHL_ENABLE_EXPERIMENTAL_INSTALLSHIELD=ON
          -DOHL_WARNINGS_AS_ERRORS=ON
          -DOHL_VERSION_OVERRIDE=${{ needs.version.outputs.version }}

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  # --- Rust workspace (R2/M0-rs bootstrap; see .plan/rust-architecture-r1.md) ---
  # The C++ tree above stays authoritative for M1 until Rust reaches parity;
  # both build systems and both policy checkers run in CI during the
  # transition (.plan/rust-architecture-r1.md section 4).

  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all --check

  rust-policy:
    name: Rust policy and crate graph
    needs: version
    runs-on: ubuntu-latest
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked-file policy
        run: cargo xtask policy

      - name: Check crate dependency graph
        run: cargo xtask graph

  rust-clippy:
    name: Rust clippy (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: windows-latest
            name: Windows x64
          - os: macos-latest
            name: macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      OHL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace

      - name: Doctest
        run: cargo test --workspace --doc

  rust-deny:
    name: Rust cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
