[package]
name = "ohl-world"
description = "Renderable world model built from clean-room GoldSrc BSP v30 data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohl_world"

[features]
default = []
# Publishes the synthetic-room BSP/WAD fixture writers as a public,
# non-`cfg(test)` API so `ohl-render`'s headless test and `ohl-app`'s
# development-only `--dev-bsp` manual check can share one project-authored
# fixture instead of each inventing their own.
test-support = ["ohl-formats/test-support"]

[dependencies]
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = ["std"] }
# Decodes the six skybox TGA faces only; no PNG/JPEG/etc. codecs are pulled
# in, and the default-feature codec/format grab-bag is disabled.
image = { version = "=0.25.10", default-features = false, features = [
    "tga",
    "bmp",
] }

[dev-dependencies]
proptest = { workspace = true }
ohl-world = { path = ".", features = ["test-support"] }

[lints]
workspace = true
