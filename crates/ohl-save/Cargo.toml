[package]
name = "ohl-save"
description = "Project-owned, versioned save-file container: bounded header, tagged section table with per-section and whole-file SHA-256 integrity, and an atomic-write save-slot directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohl_save"

[dependencies]
ohl-core = { path = "../ohl-core", version = "=0.1.0", features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { workspace = true, features = ["alloc"] }
directories = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
