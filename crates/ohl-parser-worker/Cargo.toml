[package]
name = "ohl-parser-worker"
description = "Builder, install location and host-side contract for the freestanding Linux media-parser worker image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ohl_parser_worker"

# The freestanding image in `image/` is a standalone package, so the shipping
# library here has no dependencies at all. The integration test drives a real
# confined worker, which is why the launcher and the wire protocol appear as
# development dependencies only.
[dev-dependencies]
ohl-parser-protocol = { path = "../ohl-parser-protocol", version = "=0.1.0" }
ohl-platform = { path = "../ohl-platform", version = "=0.1.0" }

[lints]
workspace = true
