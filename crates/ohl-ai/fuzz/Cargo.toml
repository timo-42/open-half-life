# Standalone fuzzing package for `ohl-ai`'s monster-spawn path.
#
# Deliberately excluded from the main workspace: `cargo fuzz` needs a nightly
# toolchain and a `libfuzzer-sys` dependency the pinned stable build must not
# acquire. Run explicitly:
#
#     cargo +nightly fuzz run entity_defs_spawn

[workspace]
members = ["."]

[package]
name = "ohl-ai-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Pinned exact, matching the root workspace's own `arbitrary` pin (it is not
# in `[workspace.dependencies]` for this standalone, non-member package, so
# it is pinned again here).
arbitrary = { version = "=1.4.2", features = ["derive"] }

[dependencies.ohl-ai]
path = ".."

[dependencies.ohl-game]
path = "../../ohl-game"

[[bin]]
name = "entity_defs_spawn"
path = "fuzz_targets/entity_defs_spawn.rs"
test = false
doc = false
bench = false
