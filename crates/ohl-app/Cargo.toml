[package]
name = "ohl-app"
description = "Open Half-Life Rust composition-root binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "open-half-life"
path = "src/main.rs"

[features]
default = []
# Development-only aids that are never part of a release build. `dev-tools`
# adds `--dev-bsp`, which loads a map straight off disk and bypasses the
# media pipeline entirely; see `docs/MILESTONES.md`. It must stay off by
# default so no shipped binary can be pointed at arbitrary files this way.
# The production playable loop needs the renderer, world, engine and UI
# crates unconditionally, so `dev-tools` now only gates the extra viewers'
# own code paths, not their dependencies.
dev-tools = []

[dependencies]
ohl-core = { path = "../ohl-core", version = "=0.1.0", features = ["std"] }
ohl-platform = { path = "../ohl-platform", version = "=0.1.0" }
ohl-media = { path = "../ohl-media", version = "=0.1.0" }
ohl-vfs = { path = "../ohl-vfs", version = "=0.1.0" }
ohl-media-archive = { path = "../ohl-media-archive", version = "=0.1.0" }
ohl-iso9660 = { path = "../ohl-iso9660", version = "=0.1.0" }
ohl-udf = { path = "../ohl-udf", version = "=0.1.0" }
ohl-import = { path = "../ohl-import", version = "=0.1.0" }
ohl-payload = { path = "../ohl-payload", version = "=0.1.0" }
directories = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
ohl-render = { path = "../ohl-render", version = "=0.1.0" }
ohl-world = { path = "../ohl-world", version = "=0.1.0" }
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = [
    "std",
] }
ohl-physics = { path = "../ohl-physics", version = "=0.1.0" }
ohl-game = { path = "../ohl-game", version = "=0.1.0" }
ohl-engine = { path = "../ohl-engine", version = "=0.1.0" }
ohl-ui = { path = "../ohl-ui", version = "=0.1.0" }
ohl-campaign = { path = "../ohl-campaign", version = "=0.1.0" }
# Only the PNG encoder: the headless capture writes one, and no other codec
# is compiled in.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# Pinned exact to match `ohl-game`'s and `ohl-physics`'s own pins; used to
# build the `Vec3` `find_usable_within` expects from the camera/player
# position.
glam = { version = "=0.33.6", default-features = false, features = ["std"] }
ohl-assets = { path = "../ohl-assets", version = "=0.1.0" }
# `default-features = false` deliberately drops `wayland-csd-adwaita`, whose
# sctk-adwaita -> ab_glyph -> ttf-parser chain carries an unmaintained-crate
# advisory (RUSTSEC-2026-0192). Client-side decorations on Wayland fall back
# to the compositor's, which is fine for a development-only viewer.
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }

[dev-dependencies]
ohl-engine = { path = "../ohl-engine", version = "=0.1.0", features = [
    "test-support",
] }
ohl-iso9660 = { path = "../ohl-iso9660", version = "=0.1.0", features = [
    "test-support",
] }
tempfile = { workspace = true }
hadris-iso = { workspace = true }
ohl-parser-protocol = { path = "../ohl-parser-protocol", version = "=0.1.0" }
# The synthetic Wise package writer, for the real-worker import test. It is a
# development dependency only: nothing shipped builds it.
ohl-wise = { path = "../ohl-wise", version = "=0.1.0", features = [
    "std",
    "test-support",
] }

[lints]
workspace = true
