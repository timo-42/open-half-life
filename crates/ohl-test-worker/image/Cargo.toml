# Standalone test image with a private abort-on-panic profile. Linux builds
# use the fixed static musl target; macOS builds link the system runtime.
[package]
name = "ohl-test-worker-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "ohl-media-parser-worker"
path = "src/main.rs"

[features]
default = []
# Never writes the readiness attestation, so the host observes a startup
# deadline expiry instead of a ready worker.
never-ready = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
codegen-units = 1
