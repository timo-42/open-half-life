[package]
name = "ohl-player"
description = "Player systems: health and HEV armor, fall damage, drowning, liquid and trigger_hurt damage, HEV suit voice events, flashlight, long jump ownership and HUD/save state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohl_player"

[features]
default = []
# Converts this crate's HUD snapshot into `ohl_ui::HudState`. Off by default
# so a headless build (tests, dedicated logic, cross-target checks) does not
# pull in egui/wgpu/winit for four integer fields.
hud = ["dep:ohl-ui"]

[dependencies]
ohl-physics = { path = "../ohl-physics", version = "=0.1.0" }
ohl-game = { path = "../ohl-game", version = "=0.1.0" }
ohl-save = { path = "../ohl-save", version = "=0.1.0" }
ohl-ui = { path = "../ohl-ui", version = "=0.1.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }
ohl-physics = { path = "../ohl-physics", version = "=0.1.0", features = [
    "test-support",
] }

[lints]
workspace = true
