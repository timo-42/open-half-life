[package]
name = "ohl-engine"
description = "Game state: world, entities, map logic, physics and rendering composed into one tickable loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohl_engine"

[features]
default = []
# Publishes the synthetic map fixture used by this crate's own tests so
# `ohl-app`'s CLI test can build the same payload tree without inventing a
# second fixture.
test-support = ["ohl-formats/test-support", "ohl-world/test-support"]

[dependencies]
ohl-core = { path = "../ohl-core", version = "=0.1.0", features = ["std"] }
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = ["std"] }
ohl-world = { path = "../ohl-world", version = "=0.1.0" }
ohl-render = { path = "../ohl-render", version = "=0.1.0" }
ohl-physics = { path = "../ohl-physics", version = "=0.1.0" }
ohl-game = { path = "../ohl-game", version = "=0.1.0", features = ["serde"] }
# M7.9 P0: the engine owns the health/armour components and the entity-id
# vocabulary every attack trace speaks, so it composes `ohl-combat` directly.
ohl-combat = { path = "../ohl-combat", version = "=0.1.0" }
# M7.9 P2: the monster AI world, its brains and the `monstermaker` spawner,
# plus the node graph the AI's navigator paths over.
ohl-ai = { path = "../ohl-ai", version = "=0.1.0" }
ohl-nav = { path = "../ohl-nav", version = "=0.1.0" }
# The HUD the host draws is state this crate writes, not an event stream.
ohl-ui = { path = "../ohl-ui", version = "=0.1.0" }
ohl-save = { path = "../ohl-save", version = "=0.1.0" }
ohl-campaign = { path = "../ohl-campaign", version = "=0.1.0" }
# Exact-pinned to match `ohl-save`'s and `ohl-game`'s own pins: the save
# sections this crate writes are serialized with all three in the same tree.
serde = { version = "=1.0.229", features = ["derive"] }
ohl-assets = { path = "../ohl-assets", version = "=0.1.0" }
# Pinned exact to match `ohl-game`'s and `ohl-physics`'s own pins: the
# vector type crosses all three boundaries.
glam = { version = "=0.33.6", default-features = false, features = [
    "std",
    "serde",
] }

[dev-dependencies]
ohl-engine = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
proptest = { workspace = true }
# The integration tests name these crates' types directly (a save slot, a
# difficulty, an entity component), so they need them as dev-dependencies
# even though the library already depends on them.
ohl-save = { path = "../ohl-save", version = "=0.1.0" }
ohl-campaign = { path = "../ohl-campaign", version = "=0.1.0" }
ohl-game = { path = "../ohl-game", version = "=0.1.0", features = ["serde"] }
ohl-combat = { path = "../ohl-combat", version = "=0.1.0" }
ohl-ai = { path = "../ohl-ai", version = "=0.1.0" }
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = [
    "std",
    "test-support",
] }

[lints]
workspace = true
