# Standalone fuzzing package for `ohl-engine`'s `GameSave` decoder.
#
# Deliberately excluded from the main workspace: `cargo fuzz` needs a nightly
# toolchain and a `libfuzzer-sys` dependency the pinned stable build must not
# acquire. Run explicitly:
#
#     cargo +nightly fuzz run decode_fuzz
#     cargo +nightly fuzz run sections_fuzz

[workspace]
members = ["."]

[package]
name = "ohl-engine-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Pinned exact, matching the root workspace's own `arbitrary` pin (it is not
# in `[workspace.dependencies]` for this standalone, non-member package, so
# it is pinned again here).
arbitrary = { version = "=1.4.2", features = ["derive"] }

[dependencies.ohl-engine]
path = ".."

[dependencies.ohl-save]
path = "../../ohl-save"

[[bin]]
name = "decode_fuzz"
path = "fuzz_targets/decode_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sections_fuzz"
path = "fuzz_targets/sections_fuzz.rs"
test = false
doc = false
bench = false
