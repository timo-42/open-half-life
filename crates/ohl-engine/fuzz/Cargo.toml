# Standalone fuzzing package for `ohl-engine`'s `GameSave` decoder.
#
# Deliberately excluded from the main workspace: `cargo fuzz` needs a nightly
# toolchain and a `libfuzzer-sys` dependency the pinned stable build must not
# acquire. Run explicitly:
#
#     cargo +nightly fuzz run decode_fuzz
#     cargo +nightly fuzz run sections_fuzz
#     cargo +nightly fuzz run restore_fuzz

[workspace]
members = ["."]

[package]
name = "ohl-engine-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Pinned exact, matching the root workspace's own `arbitrary` pin (it is not
# in `[workspace.dependencies]` for this standalone, non-member package, so
# it is pinned again here).
arbitrary = { version = "=1.4.2", features = ["derive"] }

[dependencies.ohl-engine]
path = ".."
# `restore_fuzz` builds a real base save over this crate's own synthetic map
# fixture (`ohl_engine::test_support`), so it needs the feature that exposes
# it (which in turn enables `ohl-formats`'/`ohl-world`'s own `test-support`).
features = ["test-support"]

[dependencies.ohl-save]
path = "../../ohl-save"

[[bin]]
name = "decode_fuzz"
path = "fuzz_targets/decode_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sections_fuzz"
path = "fuzz_targets/sections_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "restore_fuzz"
path = "fuzz_targets/restore_fuzz.rs"
test = false
doc = false
bench = false
