[package]
name = "ohl-assets"
description = "GoldSrc-style asset filesystem resolving game-relative paths over loose files and Quake PAK archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohl_assets"

[dependencies]
ohl-core = { path = "../ohl-core", version = "=0.1.0", features = ["std"] }
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = [
    "std",
] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
ohl-formats = { path = "../ohl-formats", version = "=0.1.0", features = [
    "std",
    "test-support",
] }

[lints]
workspace = true
