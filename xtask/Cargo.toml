[package]
name = "xtask"
description = "Repository policy and crate-graph checks for the Open Half-Life Rust workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }
toml = "1.1.5"

# `cargo xtask worker-image` builds and inspects the freestanding isolated-worker
# test image. `ohl-test-worker` is a development-only crate; nothing shipping
# depends on it.
ohl-test-worker = { path = "../crates/ohl-test-worker", version = "=0.1.0" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
