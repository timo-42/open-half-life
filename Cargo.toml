[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/timo-42/open-half-life"

# M9.3 release packaging polish: smaller, faster shipped binaries.
# `panic` is intentionally left at its default (`unwind`) — nothing in this
# workspace relies on `panic = "abort"`, and changing it is out of scope
# here.
[profile.release]
strip = "symbols"
codegen-units = 1
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# Pinned exact versions for crates named by the Rust migration architecture
# (.plan/rust-architecture-r1.md). Individual crates depend on the subset they
# use; only add entries here, never bump implicitly.
[workspace.dependencies]
thiserror = { version = "=2.0.20", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
clap = "=4.6.6"
sha2 = { version = "=0.10.9", default-features = false }
zerocopy = "=0.8.56"
winnow = "=0.7.13"
postcard = "=1.1.3"
tempfile = "=3.27.0"
fs4 = "=0.13.1"
directories = "=6.0.0"
rustix = "=1.1.4"
seccompiler = "=0.5.0"
landlock = "=0.4.7"
hadris-iso = "=2.3.0"
hadris-udf = "=2.3.0"
miniz_oxide = "=0.8.9"
proptest = "=1.11.0"
insta = "=1.48.0"
arbitrary = "=1.4.2"
