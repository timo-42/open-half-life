# Standalone fuzzing workspace.
#
# It is deliberately excluded from the main workspace: `cargo fuzz` needs a
# nightly toolchain and a `libfuzzer-sys` dependency that the pinned stable
# build must not acquire. Run it explicitly:
#
#     cargo +nightly fuzz run iso9660_preflight
#     cargo +nightly fuzz run udf_preflight
#     cargo +nightly fuzz run cabinet_header
#     cargo +nightly fuzz run cabinet_extract
#     cargo +nightly fuzz run isz_header
#     cargo +nightly fuzz run isz_explode
[workspace]
members = ["."]

[package]
name = "ohl-media-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ohl-iso9660 = { path = "../crates/ohl-iso9660", version = "=0.1.0" }
ohl-udf = { path = "../crates/ohl-udf", version = "=0.1.0" }
ohl-media-archive = { path = "../crates/ohl-media-archive", version = "=0.1.0" }
ohl-cabinet-format = { path = "../crates/ohl-cabinet-format", version = "=0.1.0", features = ["test-support"] }
ohl-cabinet = { path = "../crates/ohl-cabinet", version = "=0.1.0", features = [
    "inflate",
    "md5",
    "test-support",
] }
ohl-isz = { path = "../crates/ohl-isz", version = "=0.1.0", features = [
    "std",
    "test-support",
] }

[[bin]]
name = "iso9660_preflight"
path = "fuzz_targets/iso9660_preflight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udf_preflight"
path = "fuzz_targets/udf_preflight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cabinet_header"
path = "fuzz_targets/cabinet_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cabinet_extract"
path = "fuzz_targets/cabinet_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "isz_header"
path = "fuzz_targets/isz_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "isz_explode"
path = "fuzz_targets/isz_explode.rs"
test = false
doc = false
bench = false
